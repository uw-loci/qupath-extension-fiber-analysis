name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # fiberlib ships inside the jar and has no Java coverage, so the pytest
      # suite is the only thing testing it. The gradle task skips loudly when
      # the scientific stack is absent -- without these installs CI would go
      # green having tested none of the Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # numpy is pinned to match the shipped Appose environment, which pins
      # numpy<2 (resolves to 1.26.4). Left unpinned, pip resolves numpy 2.x
      # here and CI then tests a stack no user runs. Measured 2026-10-13:
      # every numeric output is bit-identical across the two majors except
      # the axial angle mean, which differs by 8e-7 because the angle field
      # is float32 -- so this pin is about testing what ships, not about a
      # known numpy 2 incompatibility.
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip "numpy<2" scipy scikit-image pillow matplotlib pytest scikit-learn joblib

      - name: Confirm the Python suite will actually run
        shell: bash
        run: |
          python -c "import pytest, numpy, skimage, sklearn; print('python deps OK')"

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run ./gradlew build --stacktrace
        env:
          DISPLAY: ':99'

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew build --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/test-results/**/*.xml
            build/reports/tests/**
          if-no-files-found: ignore
